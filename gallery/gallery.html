<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEYBEY WORLD — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery.css">
  <link rel="stylesheet" href="../nav.css">
</head>
<body>

<div class="beybey-gallery">

  <!-- Background image -->
  <div class="page-image-bg">
    <img src="../background.jpeg" alt="Beyblade Arena">
  </div>

  <!-- Fixed floating nav -->
  <div class="nav-wrapper">
    <nav class="navbar">
      <ul class="nav-menu">
        <li><a href="../home.html">Home</a></li>
        <li><a href="../news/news.html">News</a></li>
        <li><a href="../gallery/gallery.html" class="active">Gallery</a></li>
        <li><a href="../custom/custom.html">Custom</a></li>
        <li><a href="../battle/battle.html">Battle</a></li>
        <li><a href="../series/series.html">Series</a></li>
      </ul>
    </nav>
  </div>

  <!-- Page hero header -->
  <section class="hero">
    <div class="container">
      <h1><span class="accent">Gallery</span></h1>
      <p>Collection of speed, power, and precision</p>
      <p style="margin-top:2px;">Timeless tribute to the Beyblades legacy</p>
    </div>
  </section>

  <!-- Gallery section -->
  <section class="section" style="padding-top: 0;">
    <div class="container">
      <div class="gallery-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="og">OG</button>
        <button class="filter-btn" data-filter="metal">Metal</button>
        <button class="filter-btn" data-filter="burst">Burst</button>
        <button class="filter-btn" data-filter="x">X</button>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

</div>

<script src="gallery.js"></script>
<script src="../nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <!-- MAIN CHARACTERS -->
  <h2 class="section-title">MAIN CHARACTERS</h2>
  <div class="carousel-wrap">
    <div class="carousel-track">
      <div class="carousel-grid" id="charGrid"></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- EPISODES -->
  <h2 class="section-title">EPISODES</h2>
  <div class="carousel-wrap">
    <button class="arrow-btn" id="vidPrev">&#8249;</button>
    <div class="carousel-track">
      <div class="carousel-grid" id="vidGrid"></div>
    </div>
    <button class="arrow-btn" id="vidNext">&#8250;</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
